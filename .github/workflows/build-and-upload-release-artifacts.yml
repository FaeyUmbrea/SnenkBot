name: Build Release Bundles

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: Bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfontconfig1-dev libfreetype6-dev libdbus-1-dev libssl-dev pkg-config
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const frontend = JSON.parse(readFileSync("frontend/package.json", "utf8")).version;
          const desktop = JSON.parse(readFileSync("crates/snenkbot_desktop/tauri.conf.json", "utf8")).version;
          if (process.env.RELEASE_TAG !== `v${desktop}` || frontend !== desktop) {
            throw new Error("Release tag and application versions must match");
          }
          '
        shell: bash
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/snenkbot_desktop
          tauriScript: npm --prefix ../../frontend run tauri --
          args: --target ${{ matrix.target }} --ci -- --jobs 2
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          uploadUpdaterJson: false
