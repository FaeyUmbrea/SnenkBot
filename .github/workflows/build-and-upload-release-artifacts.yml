name: Build Release Bundles

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: 2

jobs:
  release:
    name: Resolve published release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - name: Find release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,databaseId,isDraft > "$RUNNER_TEMP/release.json"
          if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != false ]; then
            printf '%s\n' 'Bundle uploads require a published release.' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$(jq -r .tagName "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
          printf 'id=%s\n' "$(jq -r .databaseId "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
  build:
    needs: release
    name: Bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfontconfig1-dev libfreetype6-dev libdbus-1-dev libssl-dev pkg-config
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const frontend = JSON.parse(readFileSync("frontend/package.json", "utf8")).version;
          const desktop = JSON.parse(readFileSync("crates/snenkbot_desktop/tauri.conf.json", "utf8")).version;
          if (process.env.RELEASE_TAG !== `v${desktop}` || frontend !== desktop) {
            throw new Error("Release tag and application versions must match");
          }
          '
        shell: bash
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/snenkbot_desktop
          tauriScript: npm --prefix ../../frontend run tauri
          args: --target ${{ matrix.target }} --ci -- --jobs 2
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ needs.release.outputs.tag }}
          uploadUpdaterJson: false
